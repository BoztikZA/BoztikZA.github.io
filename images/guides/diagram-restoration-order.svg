<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 290" width="780" height="290" role="img" aria-labelledby="t d"><title id="t">The order of a photo restoration</title><desc id="d">Scan, straighten and crop, repair damage, fix tone, fix colour, sharpen last, then export.</desc><rect width="780" height="290" rx="18" fill="#0b110d"/><rect x="24" y="112" width="92" height="92" rx="10" fill="#13201a" stroke="#2a3a2e" stroke-width="2" /><text x="70.0" y="150" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="800" fill="#8eff3d" text-anchor="middle" >1</text><text x="70.0" y="174" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#f6fff4" text-anchor="middle" >Scan</text><line x1="118" y1="155" x2="130" y2="155" stroke="#8eff3d" stroke-width="2" stroke-linecap="round"/><path d="M120.1 159.8 L130 155 L120.1 150.2" fill="none" stroke="#8eff3d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="132" y="112" width="92" height="92" rx="10" fill="#13201a" stroke="#2a3a2e" stroke-width="2" /><text x="178.0" y="150" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="800" fill="#8eff3d" text-anchor="middle" >2</text><text x="178.0" y="174" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#f6fff4" text-anchor="middle" >Straighten</text><text x="178.0" y="188" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#f6fff4" text-anchor="middle" >&amp; crop</text><line x1="226" y1="155" x2="238" y2="155" stroke="#8eff3d" stroke-width="2" stroke-linecap="round"/><path d="M228.1 159.8 L238 155 L228.1 150.2" fill="none" stroke="#8eff3d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="240" y="112" width="92" height="92" rx="10" fill="#13201a" stroke="#8eff3d" stroke-width="3" /><text x="286.0" y="150" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="800" fill="#8eff3d" text-anchor="middle" >3</text><text x="286.0" y="174" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#f6fff4" text-anchor="middle" >Repair</text><text x="286.0" y="188" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#f6fff4" text-anchor="middle" >damage</text><line x1="334" y1="155" x2="346" y2="155" stroke="#8eff3d" stroke-width="2" stroke-linecap="round"/><path d="M336.1 159.8 L346 155 L336.1 150.2" fill="none" stroke="#8eff3d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="348" y="112" width="92" height="92" rx="10" fill="#13201a" stroke="#2a3a2e" stroke-width="2" /><text x="394.0" y="150" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="800" fill="#8eff3d" text-anchor="middle" >4</text><text x="394.0" y="174" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#f6fff4" text-anchor="middle" >Fix tone</text><line x1="442" y1="155" x2="454" y2="155" stroke="#8eff3d" stroke-width="2" stroke-linecap="round"/><path d="M444.1 159.8 L454 155 L444.1 150.2" fill="none" stroke="#8eff3d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="456" y="112" width="92" height="92" rx="10" fill="#13201a" stroke="#2a3a2e" stroke-width="2" /><text x="502.0" y="150" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="800" fill="#8eff3d" text-anchor="middle" >5</text><text x="502.0" y="174" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#f6fff4" text-anchor="middle" >Fix colour</text><line x1="550" y1="155" x2="562" y2="155" stroke="#8eff3d" stroke-width="2" stroke-linecap="round"/><path d="M552.1 159.8 L562 155 L552.1 150.2" fill="none" stroke="#8eff3d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="564" y="112" width="92" height="92" rx="10" fill="#13201a" stroke="#2a3a2e" stroke-width="2" /><text x="610.0" y="150" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="800" fill="#8eff3d" text-anchor="middle" >6</text><text x="610.0" y="174" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#f6fff4" text-anchor="middle" >Sharpen</text><text x="610.0" y="188" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#f6fff4" text-anchor="middle" >last</text><line x1="658" y1="155" x2="670" y2="155" stroke="#8eff3d" stroke-width="2" stroke-linecap="round"/><path d="M660.1 159.8 L670 155 L660.1 150.2" fill="none" stroke="#8eff3d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="672" y="112" width="92" height="92" rx="10" fill="#13201a" stroke="#2a3a2e" stroke-width="2" /><text x="718.0" y="150" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="800" fill="#8eff3d" text-anchor="middle" >7</text><text x="718.0" y="174" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#f6fff4" text-anchor="middle" >Export</text><text x="24" y="60" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#f6fff4" text-anchor="start" >Work in this order. Each step makes the next one easier.</text><text x="24" y="250" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#b5c3b2" text-anchor="start" >Repair first, so tone and colour work are not applied on top of visible damage.</text></svg>