<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="t d"><title id="t">A stack of four Photoshop layers</title><desc id="d">From the bottom: the untouched original scan, a copy of the original, a repairs layer, and a Curves adjustment layer on top.</desc><rect width="760" height="360" rx="18" fill="#0b110d"/><rect x="40" y="40" width="400" height="56" rx="10" fill="#17281f" stroke="#5fe3c2" stroke-width="2" /><text x="64" y="75" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#f6fff4" text-anchor="start" >Curves (adjustment layer)</text><text x="420" y="75" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#b5c3b2" text-anchor="end" >tone</text><rect x="40" y="110" width="400" height="56" rx="10" fill="#17281f" stroke="#8eff3d" stroke-width="2" /><text x="64" y="145" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#f6fff4" text-anchor="start" >Repairs (empty layer)</text><text x="420" y="145" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#b5c3b2" text-anchor="end" >spots, scratches</text><rect x="40" y="180" width="400" height="56" rx="10" fill="#13201a" stroke="#2a3a2e" stroke-width="2" /><text x="64" y="215" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#f6fff4" text-anchor="start" >Copy of original</text><text x="420" y="215" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#b5c3b2" text-anchor="end" >safe to experiment</text><rect x="40" y="250" width="400" height="56" rx="10" fill="#13201a" stroke="#2a3a2e" stroke-width="2" /><text x="64" y="285" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#f6fff4" text-anchor="start" >Original scan (untouched)</text><text x="420" y="285" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#b5c3b2" text-anchor="end" >locked</text><line x1="520" y1="290" x2="520" y2="60" stroke="#8eff3d" stroke-width="3" stroke-linecap="round"/><path d="M524.8 69.9 L520 60 L515.2 69.9" fill="none" stroke="#8eff3d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="545" y="175" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#b5c3b2" text-anchor="start" >Layers are read</text><text x="545" y="198" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#b5c3b2" text-anchor="start" >from bottom to top</text><text x="545" y="230" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#f6fff4" text-anchor="start" >Edits on top never</text><text x="545" y="253" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#f6fff4" text-anchor="start" >change the pixels</text><text x="545" y="276" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#f6fff4" text-anchor="start" >underneath.</text></svg>