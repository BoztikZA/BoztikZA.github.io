name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage public website files (private and scratch files excluded)
        shell: bash
        run: |
          # Publish the marketing site and Deliver browser app. Exclude Worker source,
          # scratch HTML pages, supporting docs and other non-production files.
          mkdir -p _site
          cp -r js images deliver-v3 spotlight _site/
          cp -- \
            index.html 404.html stores.html discover.html about.html contact.html creative-assistant.html creative-studio.html creative-studio.webmanifest creative-studio-sw.js creative-toolkit.html \
            deliver.html guide-ai-vs-professional-editing.html guide-object-removal.html \
            guide-overedited-look.html guide-photo-restoration.html guides.html \
            guide-layers-and-masks.html guide-image-resolution-dpi.html guide-jpeg-png-tiff.html guide-scanning-old-photos.html \
            guide-natural-portrait-retouching.html guide-faded-photo-colour-correction.html \
            image-inspector.html portfolio.html privacy.html services.html support.html \
            terms.html spotlight.html *.css CNAME robots.txt ads.txt sitemap.xml .nojekyll _site/

      # Validate the exact folder that will be uploaded, not just files in the source tree.
      - name: Validate staged Pages artifact
        shell: bash
        run: |
          set -euo pipefail

          for file in index.html ads.txt robots.txt sitemap.xml; do
            if [[ ! -s "_site/$file" ]]; then
              echo "::error::Required public file is missing or empty: _site/$file"
              exit 1
            fi
          done

          expected_ads='google.com, pub-3739684241868984, DIRECT, f08c47fec0942fa0'
          printf '%s\n' "$expected_ads" > "$RUNNER_TEMP/expected-ads.txt"
          if ! cmp --silent "$RUNNER_TEMP/expected-ads.txt" _site/ads.txt; then
            echo "::error::The staged ads.txt does not exactly match the expected publisher declaration."
            echo "Expected:"
            cat "$RUNNER_TEMP/expected-ads.txt"
            echo "Staged:"
            cat _site/ads.txt
            exit 1
          fi

          if ! grep -Fq '<link rel="canonical" href="https://www.boztik.com/">' _site/index.html; then
            echo "::error::The staged homepage is missing the expected www canonical URL."
            exit 1
          fi

          if ! grep -Fq 'client=ca-pub-3739684241868984' _site/index.html; then
            echo "::error::The staged homepage is missing the expected AdSense publisher loader."
            exit 1
          fi

          # Every public URL in the sitemap must carry the AdSense loader so
          # Auto ads can be configured consistently from the AdSense account.
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from urllib.parse import unquote, urlparse

          sitemap = ET.parse("_site/sitemap.xml").getroot()
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          urls = [node.text for node in sitemap.findall(".//sm:loc", ns)]
          if not urls:
              raise SystemExit("::error::The sitemap contains no page URLs.")

          missing = []
          for url in urls:
              parsed = urlparse(url)
              if parsed.netloc not in {"www.boztik.com", "boztik.com"}:
                  continue
              path = unquote(parsed.path or "/")
              if path.endswith("/"):
                  path += "index.html"
              elif not os.path.splitext(path)[1]:
                  path += "/index.html"
              file_path = os.path.join("_site", path.lstrip("/"))
              if not os.path.isfile(file_path):
                  missing.append(f"{url} (missing staged file: {file_path})")
                  continue
              with open(file_path, encoding="utf-8") as handle:
                  html = handle.read()
              if "pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3739684241868984" not in html:
                  missing.append(f"{url} (missing AdSense loader)")
          if missing:
              raise SystemExit("::error::AdSense code coverage failed:\\n" + "\\n".join(missing))
          print(f"AdSense loader present on all {len(urls)} sitemap URL(s).")
          PY

          if ! grep -Fq 'Sitemap: https://www.boztik.com/sitemap.xml' _site/robots.txt; then
            echo "::error::The staged robots.txt is missing the expected sitemap URL."
            exit 1
          fi

          # Google says ads.txt may be ignored if robots.txt blocks the ads.txt path
          # or the relevant crawler. Test the staged policy, not just its text.
          python3 - <<'PY'
          from urllib.robotparser import RobotFileParser

          parser = RobotFileParser()
          parser.parse(open("_site/robots.txt", encoding="utf-8").read().splitlines())

          checks = {
              "Mediapartners-Google": [
                  "https://www.boztik.com/ads.txt",
                  "https://www.boztik.com/",
              ],
              "Google-Display-Ads-Bot": [
                  "https://www.boztik.com/ads.txt",
                  "https://www.boztik.com/",
              ],
              "AdsBot-Google": [
                  "https://www.boztik.com/ads.txt",
                  "https://www.boztik.com/",
              ],
          }

          for user_agent, urls in checks.items():
              for url in urls:
                  if not parser.can_fetch(user_agent, url):
                      raise SystemExit(
                          f"::error::robots.txt blocks {user_agent} from {url}"
                      )
                  print(f"robots.txt allows {user_agent}: {url}")
          PY

          echo "Staged Pages artifact passed required-file, ads.txt, canonical, AdSense, sitemap and crawler-access checks."

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      # This is diagnostic only: a transient live-site failure is recorded in the
      # Actions log but does not roll back or mark a successful deployment as failed.
      - name: Smoke-test deployed homepage and ads.txt
        if: success()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT

          fetch_page() {
            local url="$1"
            local output="$2"
            local expected_url="$3"
            local metadata
            local status effective_url content_type

            metadata="$(curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 45 \
              --retry 5 --retry-all-errors --retry-delay 5 \
              --output "$output" \
              --write-out '%{http_code}\t%{url_effective}\t%{content_type}' \
              "$url")"

            IFS=$'\t' read -r status effective_url content_type <<< "$metadata"
            printf 'Requested: %s\nHTTP status: %s\nFinal URL: %s\nContent-Type: %s\n' \
              "$url" "$status" "$effective_url" "$content_type"

            [[ "$status" == "200" ]]
            [[ "$effective_url" == "$expected_url" ]]
          }

          expected_ads="$RUNNER_TEMP/expected-live-ads.txt"
          printf '%s\n' 'google.com, pub-3739684241868984, DIRECT, f08c47fec0942fa0' > "$expected_ads"

          # Record the DNS answers seen by the GitHub runner. These are diagnostic;
          # they help distinguish an HTTP/redirect problem from a DNS problem.
          if command -v dig >/dev/null 2>&1; then
            echo "DNS A records for boztik.com:"
            dig +noall +answer boztik.com A || true
            echo "DNS AAAA records for boztik.com:"
            dig +noall +answer boztik.com AAAA || true
            echo "DNS records for www.boztik.com:"
            dig +noall +answer www.boztik.com A || true
            dig +noall +answer www.boztik.com CNAME || true
          fi

          fetch_page 'https://www.boztik.com/' "$tmp_dir/homepage.html" 'https://www.boztik.com/'
          grep -Fq '<link rel="canonical" href="https://www.boztik.com/">' "$tmp_dir/homepage.html"
          grep -Fq 'client=ca-pub-3739684241868984' "$tmp_dir/homepage.html"

          # Explicitly test the homepage host redirects, not only the www destination.
          # This is important because AdSense may initially request the apex hostname
          # even when the preferred canonical hostname is www.
          for url in \\
            'http://boztik.com/' \\
            'https://boztik.com/' \\
            'http://www.boztik.com/' \\
            'https://www.boztik.com/'; do
            safe_name="$(printf '%s' "$url" | tr ':/' '__')"
            output="$tmp_dir/home-$safe_name.html"
            fetch_page "$url" "$output" 'https://www.boztik.com/'
            grep -Fq '<link rel="canonical" href="https://www.boztik.com/">' "$output"
            grep -Fq 'client=ca-pub-3739684241868984' "$output"
          done

          # Repeat the public homepage and ads.txt requests with Google's named
          # advertising crawler identities. These checks establish HTTP reachability
          # and response content; they do not impersonate Google's network or prove
          # that Google's production crawler can reach the origin.
          for user_agent in \\
            'Mediapartners-Google' \\
            'Google-Display-Ads-Bot' \\
            'AdsBot-Google'; do
            echo "Crawler user-agent smoke test: $user_agent"
            for path in '/' '/ads.txt'; do
              code="$(curl --silent --show-error --location \\
                --connect-timeout 10 --max-time 45 \\
                --retry 3 --retry-all-errors --retry-delay 3 \\
                --user-agent "$user_agent" \\
                --output "$tmp_dir/crawler-response.txt" \\
                --write-out '%{http_code}' \\
                "https://boztik.com$path")"
              [[ "$code" == "200" ]]
              if [[ "$path" == "/ads.txt" ]]; then
                cmp --silent "$expected_ads" "$tmp_dir/crawler-response.txt"
              else
                grep -Fq '<link rel="canonical" href="https://www.boztik.com/">' "$tmp_dir/crawler-response.txt"
                grep -Fq 'client=ca-pub-3739684241868984' "$tmp_dir/crawler-response.txt"
              fi
              echo "  $path -> HTTP $code"
            done
          done

          # Record address-family behaviour separately. IPv6 can legitimately be
          # unavailable on a runner, so these are diagnostic and never fail deploy.
          for family in 4 6; do
            echo "IPv$family homepage connectivity:"
            if curl "-$family" --silent --show-error --location \\
              --connect-timeout 8 --max-time 20 \\
              --output /dev/null --write-out 'HTTP %{http_code} via %{remote_ip}\n' \\
              'https://boztik.com/'; then
              :
            else
              echo "IPv$family connection unavailable from this runner (diagnostic only)."
            fi
          done

          # Google documents that ads.txt must be reachable through both HTTP
          # and HTTPS, starting at the root/apex domain. Test every host/scheme
          # combination and require the final canonical URL and exact body.
          for url in \
            'http://boztik.com/ads.txt' \
            'https://boztik.com/ads.txt' \
            'http://www.boztik.com/ads.txt' \
            'https://www.boztik.com/ads.txt'; do
            safe_name="$(printf '%s' "$url" | tr ':/' '__')"
            output="$tmp_dir/ads-$safe_name.txt"
            fetch_page "$url" "$output" 'https://www.boztik.com/ads.txt'
            cmp --silent "$expected_ads" "$output"
          done

          # Confirm the live crawler policy and sitemap are reachable too.
          fetch_page 'https://www.boztik.com/robots.txt' "$tmp_dir/robots.txt" 'https://www.boztik.com/robots.txt'
          fetch_page 'https://www.boztik.com/sitemap.xml' "$tmp_dir/sitemap.xml" 'https://www.boztik.com/sitemap.xml'

          # Verify the two API-backed public discovery pages were actually published,
          # not merely that the homepage and AdSense files are reachable.
          fetch_page 'https://www.boztik.com/spotlight/' "$tmp_dir/spotlight.html" 'https://www.boztik.com/spotlight/'
          grep -Fq 'Boztik Spotlight — Free Business Directory for Independents' "$tmp_dir/spotlight.html"
          grep -Fq 'FREE BUSINESS DIRECTORY' "$tmp_dir/spotlight.html"
          grep -Fq 'id="sp-grid"' "$tmp_dir/spotlight.html"
          grep -Fq 'spotlight.js?v=16' "$tmp_dir/spotlight.html"
          fetch_page 'https://www.boztik.com/spotlight/spotlight.js?v=16' "$tmp_dir/spotlight.js" 'https://www.boztik.com/spotlight/spotlight.js?v=16'

          fetch_page 'https://www.boztik.com/stores.html' "$tmp_dir/stores.html" 'https://www.boztik.com/stores.html'
          grep -Fq 'Boztik Stores | Original Designs & Wallpapers' "$tmp_dir/stores.html"
          grep -Fq 'Know where your order is handled.' "$tmp_dir/stores.html"
          grep -Fq 'id="store-promotion-grid"' "$tmp_dir/stores.html"
          grep -Fq 'js/stores.js' "$tmp_dir/stores.html"
          fetch_page 'https://www.boztik.com/js/stores.js' "$tmp_dir/stores.js" 'https://www.boztik.com/js/stores.js'

          # Exercise the public read-only APIs used by those pages. The public
          # Spotlight DTO must never leak moderator/application fields.
          curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            'https://deliver-api.boztik.com/api/public/spotlight?limit=1' \
            --output "$tmp_dir/spotlight-api.json"
          curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            'https://deliver-api.boztik.com/api/public/promotions' \
            --output "$tmp_dir/promotions-api.json"
          python3 - "$tmp_dir/spotlight-api.json" "$tmp_dir/promotions-api.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              spotlight = json.load(handle)
          if not isinstance(spotlight, dict) or not isinstance(spotlight.get("profiles"), list):
              raise SystemExit("Spotlight public API did not return a profiles array.")

          forbidden = {
              "status", "contact_email", "review_events", "review_notes",
              "owner_token_hash", "owner_email", "application_token",
          }
          for profile in spotlight["profiles"]:
              leaked = forbidden.intersection(profile)
              if leaked:
                  raise SystemExit("Spotlight public API exposed private fields: " + ", ".join(sorted(leaked)))
          print(f"Spotlight public API OK: {len(spotlight['profiles'])} profile(s) in sample; no private fields.")

          with open(sys.argv[2], encoding="utf-8") as handle:
              promotions = json.load(handle)
          if not isinstance(promotions, dict) or not isinstance(promotions.get("items"), list):
              raise SystemExit("Public promotions API did not return an items array.")
          for item in promotions["items"]:
              if not all(isinstance(item.get(key), str) and item[key].strip()
                         for key in ("title", "store", "cta_label", "destination_url", "image_url")):
                  raise SystemExit("A public promotion is missing required display or destination data.")
              if not isinstance(item.get("description"), str):
                  raise SystemExit("A public promotion has an invalid description field.")
          print(f"Public promotions API OK: {len(promotions['items'])} published item(s).")
          PY

          echo "Live homepage, AdSense entry points, crawler files, Spotlight, Stores and public discovery APIs passed."
