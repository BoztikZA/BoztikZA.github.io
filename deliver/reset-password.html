<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Reset Password — Boztik Deliver</title>

  <meta
    name="description"
    content="Reset your Boztik Deliver account password."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        radial-gradient(
          circle at top,
          rgba(99, 102, 241, 0.16),
          transparent 38%
        ),
        #080b12;

      color: #f8fafc;
    }

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 460px;

      padding: 36px;

      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 24px;

      background: rgba(15, 18, 28, 0.94);

      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.45);

      backdrop-filter: blur(16px);
    }

    .brand {
      margin-bottom: 28px;
    }

    .brand-name {
      font-size: 28px;
      font-weight: 800;

      letter-spacing: -0.04em;
    }

    .brand-subtitle {
      margin-top: 6px;

      color: #94a3b8;

      font-size: 14px;
    }

    h1 {
      margin: 0 0 10px;

      font-size: 26px;

      letter-spacing: -0.03em;
    }

    .intro {
      margin: 0 0 28px;

      color: #94a3b8;

      line-height: 1.6;

      font-size: 15px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;

      margin-bottom: 8px;

      font-size: 14px;
      font-weight: 600;

      color: #e2e8f0;
    }

    input {
      width: 100%;
      height: 48px;

      padding: 0 14px;

      border-radius: 12px;

      border: 1px solid rgba(255, 255, 255, 0.12);

      outline: none;

      background: rgba(255, 255, 255, 0.05);

      color: #fff;

      font-size: 15px;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }

    input:focus {
      border-color: rgba(129, 140, 248, 0.8);

      background: rgba(255, 255, 255, 0.07);

      box-shadow:
        0 0 0 3px rgba(99, 102, 241, 0.16);
    }

    button {
      width: 100%;
      height: 50px;

      margin-top: 8px;

      border: 0;
      border-radius: 12px;

      background: #6366f1;

      color: white;

      font-size: 15px;
      font-weight: 700;

      cursor: pointer;

      transition:
        transform 0.15s ease,
        opacity 0.15s ease,
        background 0.15s ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);

      background: #5558e8;
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.55;

      cursor: not-allowed;

      transform: none;
    }

    .message {
      display: none;

      margin-top: 18px;

      padding: 13px 14px;

      border-radius: 12px;

      font-size: 14px;

      line-height: 1.5;
    }

    .message.error {
      display: block;

      background: rgba(239, 68, 68, 0.10);

      border: 1px solid rgba(239, 68, 68, 0.25);

      color: #fca5a5;
    }

    .message.success {
      display: block;

      background: rgba(34, 197, 94, 0.10);

      border: 1px solid rgba(34, 197, 94, 0.25);

      color: #86efac;
    }

    .requirements {
      margin: 8px 0 22px;

      padding-left: 18px;

      color: #64748b;

      font-size: 13px;

      line-height: 1.7;
    }

    .footer {
      margin-top: 24px;

      text-align: center;

      color: #64748b;

      font-size: 12px;
    }

    .hidden {
      display: none !important;
    }

    .loading {
      opacity: 0.65;

      pointer-events: none;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="brand">
      <div class="brand-name">
        Boztik
      </div>

      <div class="brand-subtitle">
        Deliver Command Centre
      </div>
    </div>

    <section id="reset-section">

      <h1>
        Create a new password
      </h1>

      <p class="intro">
        Choose a new password for your Boztik Deliver account.
      </p>

      <form id="reset-form">

        <div class="field">

          <label for="password">
            New password
          </label>

          <input
            id="password"
            name="password"
            type="password"
            autocomplete="new-password"
            minlength="8"
            required
          >

        </div>

        <div class="field">

          <label for="confirm-password">
            Confirm new password
          </label>

          <input
            id="confirm-password"
            name="confirm-password"
            type="password"
            autocomplete="new-password"
            minlength="8"
            required
          >

        </div>

        <ul class="requirements">

          <li>
            Use at least 8 characters.
          </li>

          <li>
            Both password fields must match.
          </li>

        </ul>

        <button
          id="reset-button"
          type="submit"
        >
          Update Password
        </button>

      </form>

      <div
        id="message"
        class="message"
        role="alert"
        aria-live="polite"
      ></div>

    </section>

    <div class="footer">
      Boztik Deliver
    </div>

  </main>

  <!--
    IMPORTANT:
    reset-password.js is inside the js folder.
  -->
  <script
    type="module"
    src="./js/reset-password.js"
  ></script>

</body>
</html>
