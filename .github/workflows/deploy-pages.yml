name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage public website files (private and scratch files excluded)
        shell: bash
        run: |
          # Publish the marketing site and Deliver browser app. Exclude Worker source,
          # scratch HTML pages, supporting docs and other non-production files.
          mkdir -p _site
          cp -r js images deliver-v3 _site/
          cp -- \
            index.html stores.html about.html contact.html creative-assistant.html creative-studio.html creative-toolkit.html \
            deliver.html guide-ai-vs-professional-editing.html guide-object-removal.html \
            guide-overedited-look.html guide-photo-restoration.html guides.html \
            guide-layers-and-masks.html guide-image-resolution-dpi.html guide-jpeg-png-tiff.html guide-scanning-old-photos.html \
            image-inspector.html portfolio.html privacy.html services.html support.html \
            terms.html *.css CNAME robots.txt ads.txt sitemap.xml .nojekyll _site/
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
