<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Application status — Boztik Spotlight</title>
  <link rel="stylesheet" href="../../styles-premium.css?v=20261106a">
  <link rel="stylesheet" href="../spotlight.css?v=12">
  <link rel="stylesheet" href="../submit/submit.css?v=7">
  <link rel="stylesheet" href="status.css?v=2">
</head>
<body class="spotlight-body">
  <header class="sp-nav">
    <a href="../../index.html" class="sp-brand" aria-label="Boztik Business Spotlight home"><span class="sp-brand-emblem" aria-hidden="true"><img src="../../images/spotlight-mark.svg" width="46" height="46" alt=""></span><span class="sp-brand-wordmark"><span>BOZTIK</span><b>BUSINESS SPOTLIGHT</b></span></a>
    <nav><a href="../">Explore directory</a></nav>
  </header>
  <main class="sp-status-wrap">
    <h1>Your application</h1>
    <p id="sp-status-state" role="status" aria-live="polite">Loading…</p>
    <section id="sp-status-card" hidden>
      <h2 id="sp-status-name"></h2>
      <p id="sp-status-headline" class="sp-status-headline"></p>
      <ol id="sp-status-steps" class="sp-status-steps"></ol>
      <p id="sp-status-detail"></p>
      <form id="sp-status-reply" hidden>
        <div class="sp-info-note"><strong>What we need from you</strong><p id="sp-info-note"></p></div>
        <label>Your reply<textarea name="message" rows="5" minlength="5" maxlength="1000" required></textarea><small>Up to 1,000 characters. Do not include passwords.</small></label>
        <button class="sp-button sp-button-primary" type="submit">Send reply</button>
        <p id="sp-reply-status" role="status" aria-live="polite"></p>
      </form>
      <p><a id="sp-status-public" class="sp-button" href="#" hidden>View your public profile</a></p>
    </section>
    <p class="sp-status-help">Lost your link? Email <a href="mailto:boztiktech@gmail.com?subject=Spotlight%20application%20status">boztiktech@gmail.com</a> with your profile name.</p>
  </main>
  <script type="module" src="./status.js?v=1"></script>
</body>
</html>
