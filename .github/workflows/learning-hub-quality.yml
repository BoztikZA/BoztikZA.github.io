name: Learning Hub quality checks

on:
  push:
    branches:
      - main
      - feat/learning-hub-seo-growth
    paths:
      - "learning/**"
      - "deliver/worker-api/src/learning/**"
      - "deliver/worker-api/src/lib/db.ts"
      - "deliver/worker-api/scripts/learning-*"
      - "deliver/worker-api/scripts/analytics-pipeline-test.mts"
      - "deliver/worker-api/package.json"
      - "deliver/worker-api/package-lock.json"
      - "deliver-v3/js/analytics-report.js"
      - "js/pageview.js"
      - "sitemap.xml"
  pull_request:
    paths:
      - "learning/**"
      - "deliver/worker-api/src/learning/**"
      - "deliver/worker-api/src/lib/db.ts"
      - "deliver/worker-api/scripts/learning-*"
      - "deliver/worker-api/scripts/analytics-pipeline-test.mts"
      - "deliver/worker-api/package.json"
      - "deliver/worker-api/package-lock.json"
      - "deliver-v3/js/analytics-report.js"
      - "js/pageview.js"
      - "sitemap.xml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  learning:
    name: Build and test Learning Hub
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deliver/worker-api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: deliver/worker-api/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Regenerate static Learning Hub pages
        run: npm run learning:pages
      - name: Check generated catalogue, pages and sitemap
        run: npm run learning:check
      - name: Type-check Worker
        run: npm run typecheck
      - name: Run complete regression suite
        run: npm test
      - name: Commit generated pages when needed
        working-directory: .
        run: |
          git add learning sitemap.xml
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: regenerate Learning Hub pages [skip ci]"
            git push
          fi
