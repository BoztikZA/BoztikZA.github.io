<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330" role="img" aria-labelledby="t d"><title id="t">Choosing between TIFF, JPEG and PNG by purpose</title><desc id="d">Keep a master copy as TIFF or PSD, share photos as JPEG, and use PNG for graphics, text or transparency.</desc><rect width="780" height="330" rx="18" fill="#0b110d"/><rect x="30" y="138" width="190" height="52" rx="10" fill="#13201a" stroke="#8eff3d" stroke-width="2" /><text x="125.0" y="170" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#f6fff4" text-anchor="middle" >What is this file for?</text><line x1="222" y1="150" x2="300" y2="70" stroke="#8eff3d" stroke-width="3" stroke-linecap="round"/><path d="M296.5 80.4 L300 70 L289.7 73.8" fill="none" stroke="#8eff3d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="222" y1="164" x2="300" y2="164" stroke="#8eff3d" stroke-width="3" stroke-linecap="round"/><path d="M290.1 168.8 L300 164 L290.1 159.2" fill="none" stroke="#8eff3d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="222" y1="178" x2="300" y2="258" stroke="#8eff3d" stroke-width="3" stroke-linecap="round"/><path d="M289.7 254.2 L300 258 L296.5 247.6" fill="none" stroke="#8eff3d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="305" y="44" width="215" height="52" rx="10" fill="#13201a" stroke="#2a3a2e" stroke-width="2" /><text x="412.5" y="76" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#f6fff4" text-anchor="middle" >Keep as the master copy</text><line x1="522" y1="70" x2="585" y2="70" stroke="#8eff3d" stroke-width="3" stroke-linecap="round"/><path d="M575.1 74.8 L585 70 L575.1 65.2" fill="none" stroke="#8eff3d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="590" y="44" width="160" height="52" rx="10" fill="#13201a" stroke="#f6fff4" stroke-width="2" /><text x="670.0" y="76" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#f6fff4" text-anchor="middle" >TIFF (or PSD)</text><rect x="305" y="138" width="215" height="52" rx="10" fill="#13201a" stroke="#2a3a2e" stroke-width="2" /><text x="412.5" y="170" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#f6fff4" text-anchor="middle" >Share, email, post online</text><line x1="522" y1="164" x2="585" y2="164" stroke="#8eff3d" stroke-width="3" stroke-linecap="round"/><path d="M575.1 168.8 L585 164 L575.1 159.2" fill="none" stroke="#8eff3d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="590" y="138" width="160" height="52" rx="10" fill="#13201a" stroke="#5fe3c2" stroke-width="2" /><text x="670.0" y="170" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#f6fff4" text-anchor="middle" >JPEG</text><rect x="305" y="232" width="215" height="52" rx="10" fill="#13201a" stroke="#2a3a2e" stroke-width="2" /><text x="412.5" y="264" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#f6fff4" text-anchor="middle" >Graphics or transparency</text><line x1="522" y1="258" x2="585" y2="258" stroke="#8eff3d" stroke-width="3" stroke-linecap="round"/><path d="M575.1 262.8 L585 258 L575.1 253.2" fill="none" stroke="#8eff3d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="590" y="232" width="160" height="52" rx="10" fill="#13201a" stroke="#8eff3d" stroke-width="2" /><text x="670.0" y="264" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#f6fff4" text-anchor="middle" >PNG</text></svg>