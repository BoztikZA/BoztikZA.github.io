<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" width="780" height="300" role="img" aria-labelledby="t d"><title id="t">Pixel arithmetic for a 4 by 6 inch print at 300 pixels per inch</title><desc id="d">A 4 by 6 inch print at 300 pixels per inch needs 1200 by 1800 pixels.</desc><rect width="780" height="300" rx="18" fill="#0b110d"/><rect x="50" y="60" width="200" height="134" rx="4" fill="#d9dcd2" stroke="#8eff3d" stroke-width="3" /><text x="150" y="135" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="800" fill="#0b110d" text-anchor="middle" >4 × 6 in</text><text x="150" y="222" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#b5c3b2" text-anchor="middle" >the print</text><text x="290" y="112" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="800" fill="#8eff3d" text-anchor="middle" >×</text><text x="340" y="108" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="800" fill="#f6fff4" text-anchor="middle" >300</text><text x="340" y="136" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#b5c3b2" text-anchor="middle" >pixels per inch</text><text x="410" y="112" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="800" fill="#8eff3d" text-anchor="middle" >=</text><rect x="450" y="50" width="280" height="160" rx="8" fill="#13201a" stroke="#5fe3c2" stroke-width="3" /><text x="590" y="120" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="800" fill="#5fe3c2" text-anchor="middle" >1200 × 1800</text><text x="590" y="148" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#b5c3b2" text-anchor="middle" >pixels needed</text><text x="40" y="265" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#b5c3b2" text-anchor="start" >Width in inches × pixels per inch = width in pixels. Do the same for the height.</text></svg>