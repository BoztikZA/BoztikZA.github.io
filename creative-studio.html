<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://www.boztik.com/creative-toolkit.html">
  <meta http-equiv="refresh" content="1; url=creative-toolkit.html">
  <title>Page moved | Boztik</title>
  <script>
    (async function () {
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.filter(function (registration) {
            return [registration.active, registration.waiting, registration.installing].some(function (worker) {
              return worker && new URL(worker.scriptURL).pathname.endsWith('/creative-studio-sw.js');
            });
          }).map(function (registration) { return registration.unregister(); }));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.filter(function (key) {
            return key.indexOf('boztik-creative-studio-') === 0;
          }).map(function (key) { return caches.delete(key); }));
        }
      } catch (error) { /* Redirect still proceeds if browser cleanup is unavailable. */ }
      window.location.replace('creative-toolkit.html' + window.location.search);
    })();
  </script>
</head>
<body>
  <p>This page has moved. You are being redirected to <a href="creative-toolkit.html">Boztik Creative Toolkit</a>.</p>
</body>
</html>
