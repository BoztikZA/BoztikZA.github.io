name: Code quality checks

on:
  pull_request:
    branches: [main]
    paths:
      - "js/**"
      - "deliver-v3/**"
      - "deliver/worker-api/**"
      - ".github/workflows/code-quality.yml"
  push:
    branches: [maintenance/repository-cleanup]

permissions:
  contents: read

jobs:
  public-javascript:
    name: Public JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          find js deliver-v3/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check local HTML, JavaScript and CSS references
        run: node .github/scripts/check-static-references.mjs

  worker:
    name: Deliver Worker typecheck and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deliver/worker-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check end-to-end test syntax
        run: node --check scripts/e2e.mjs
      - name: Run typecheck and automated tests
        run: npm test
