name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage public website files (Worker source / non-site files excluded)
        shell: bash
        run: |
          # Publish only the public static site. The Cloudflare Worker (deliver/, incl. wrangler.toml),
          # audit/docs scratch and .github are deployed elsewhere and must NOT be published as Pages.
          mkdir -p _site
          cp -r js images includes deliver-v3 _site/
          cp -- *.html *.css CNAME robots.txt ads.txt sitemap.xml .nojekyll _site/
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
