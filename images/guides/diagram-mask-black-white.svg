<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 385" width="780" height="385" role="img" aria-labelledby="t d"><title id="t">How black, white and grey on a layer mask change what you see</title><desc id="d">White on the mask shows the layer, black hides it, and grey shows it partially.</desc><rect width="780" height="385" rx="18" fill="#0b110d"/><defs><linearGradient id="gr" x1="0" x2="1"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#fff"/></linearGradient><linearGradient id="gv" x1="0" x2="1"><stop offset="0" stop-color="#0b110d"/><stop offset="1" stop-color="#8eff3d"/></linearGradient></defs><text x="40" y="61" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#f6fff4" text-anchor="start" >White</text><rect x="190" y="25" width="130" height="80" rx="8" fill="#ffffff" stroke="#f6fff4" stroke-width="2" /><text x="255" y="133" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#b5c3b2" text-anchor="middle" >mask</text><line x1="335" y1="65" x2="395" y2="65" stroke="#8eff3d" stroke-width="3" stroke-linecap="round"/><path d="M385.1 69.8 L395 65 L385.1 60.2" fill="none" stroke="#8eff3d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="410" y="25" width="130" height="80" rx="8" fill="#8eff3d" stroke="#2a3a2e" stroke-width="2" /><text x="475" y="133" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#b5c3b2" text-anchor="middle" >what you see</text><text x="565" y="71" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#b5c3b2" text-anchor="start" >layer shows</text><text x="40" y="176" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#f6fff4" text-anchor="start" >Black</text><rect x="190" y="140" width="130" height="80" rx="8" fill="#000000" stroke="#f6fff4" stroke-width="2" /><text x="255" y="248" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#b5c3b2" text-anchor="middle" >mask</text><line x1="335" y1="180" x2="395" y2="180" stroke="#8eff3d" stroke-width="3" stroke-linecap="round"/><path d="M385.1 184.8 L395 180 L385.1 175.2" fill="none" stroke="#8eff3d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="410" y="140" width="130" height="80" rx="8" fill="#0b110d" stroke="#2a3a2e" stroke-width="2" /><text x="475" y="248" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#b5c3b2" text-anchor="middle" >what you see</text><text x="565" y="186" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#b5c3b2" text-anchor="start" >layer hidden</text><text x="40" y="291" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#f6fff4" text-anchor="start" >Grey</text><rect x="190" y="255" width="130" height="80" rx="8" fill="url(#gr)" stroke="#f6fff4" stroke-width="2" /><text x="255" y="363" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#b5c3b2" text-anchor="middle" >mask</text><line x1="335" y1="295" x2="395" y2="295" stroke="#8eff3d" stroke-width="3" stroke-linecap="round"/><path d="M385.1 299.8 L395 295 L385.1 290.2" fill="none" stroke="#8eff3d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="410" y="255" width="130" height="80" rx="8" fill="url(#gv)" stroke="#2a3a2e" stroke-width="2" /><text x="475" y="363" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#b5c3b2" text-anchor="middle" >what you see</text><text x="565" y="301" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#b5c3b2" text-anchor="start" >partly shows</text></svg>